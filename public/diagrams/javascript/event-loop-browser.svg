<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Browser Event Loop</title>
  <desc id="desc">Call stack, Web APIs, microtask queue, macrotask queue, and event loop</desc>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#a1a1aa" />
    </marker>
  </defs>
  <rect x="40" y="40" width="160" height="120" rx="12" fill="#27272a" stroke="#52525b" stroke-width="2"/>
  <text x="120" y="72" text-anchor="middle" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="600">Call Stack</text>
  <text x="120" y="96" text-anchor="middle" fill="#a1a1aa" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11">sync JS runs here</text>
  <rect x="60" y="110" width="120" height="28" rx="6" fill="#3f3f46" stroke="#52525b" stroke-width="1.5"/>
  <text x="120" y="129" text-anchor="middle" fill="#a1a1aa" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11">main() to fn()</text>
  <rect x="280" y="40" width="160" height="120" rx="12" fill="#27272a" stroke="#52525b" stroke-width="2"/>
  <text x="360" y="72" text-anchor="middle" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="600">Web APIs</text>
  <text x="360" y="96" text-anchor="middle" fill="#a1a1aa" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11">setTimeout, fetch, DOM</text>
  <text x="360" y="118" text-anchor="middle" fill="#a1a1aa" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11">browser thread pool</text>
  <rect x="40" y="220" width="200" height="80" rx="12" fill="#27272a" stroke="#52525b" stroke-width="2"/>
  <text x="140" y="252" text-anchor="middle" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="600">Microtask Queue</text>
  <text x="140" y="274" text-anchor="middle" fill="#a1a1aa" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11">Promise.then, queueMicrotask</text>
  <rect x="280" y="220" width="200" height="80" rx="12" fill="#27272a" stroke="#52525b" stroke-width="2"/>
  <text x="380" y="252" text-anchor="middle" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="600">Macrotask Queue</text>
  <text x="380" y="274" text-anchor="middle" fill="#a1a1aa" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11">setTimeout, I/O, render</text>
  <ellipse cx="560" cy="210" rx="100" ry="70" fill="#27272a" stroke="#52525b" stroke-width="2"/>
  <text x="560" y="205" text-anchor="middle" fill="#fafafa" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="600">Event Loop</text>
  <text x="560" y="228" text-anchor="middle" fill="#a1a1aa" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11">stack empty?</text>
  <text x="560" y="246" text-anchor="middle" fill="#a1a1aa" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11">drain micro, then 1 macro</text>
  <path d="M200 100 L280 100" stroke="#a1a1aa" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="240" y="92" text-anchor="middle" fill="#71717a" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11">async call</text>
  <path d="M360 160 L360 220" stroke="#a1a1aa" stroke-width="2" stroke-dasharray="4 3" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M480 260 L520 230" stroke="#a1a1aa" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M560 140 L560 100 L200 100" stroke="#a1a1aa" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="520" y="118" text-anchor="middle" fill="#71717a" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11">push callback</text>
  <path d="M240 220 L200 160" stroke="#a1a1aa" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="175" y="195" text-anchor="middle" fill="#71717a" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11">drain</text>
</svg>
